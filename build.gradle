plugins {
    id 'fabric-loom' version '0.10-SNAPSHOT'
    id 'java'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Tarvittavat riippuvuudet, kuten Fabric API
    modCompile "net.fabricmc:fabric-api:${project.fabricApiVersion}"
}

// Määritellään, mitä tiedostoja luodaan ja minne
jar {
    archiveBaseName = 'biomemapmod'
    archiveVersion = version
    from(sourceSets.main.output)
}

// Asenna tai luo .jar tiedosto buildin aikana
task createJar(type: Jar) {
    archiveFileName = "biomemapmod.jar"
    from sourceSets.main.output
}

// Gradlen build-komennot
build.dependsOn createJar
