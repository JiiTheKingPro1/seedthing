name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Ensure gradlew exists
      run: ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Set executable permissions for gradlew
      run: chmod +x ./gradlew

    - name: Build mod
      run: ./gradlew build
