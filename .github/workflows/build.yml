name: Build Fabric Mod
run: ./gradlew build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'

    - name: Build mod
      run: ./gradlew build

    - name: Upload .jar to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        distribution: "major" # Vaihtoehto voi olla "release", "patch", "minor" tai "major"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
