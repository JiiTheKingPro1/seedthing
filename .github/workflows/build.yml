name: Build Fabric Mod

on:
  push:
    branches:
      - main  # Varmista, että työkalut ajetaan "main"-haaran pushin yhteydessä
  pull_request:
    branches:
      - main  # Ajetaan myös pull requestin yhteydessä

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'

    - name: Build mod
      run: ./gradlew build

    - name: Upload .jar to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
